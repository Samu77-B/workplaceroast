<style>

<script>
// Set current year
document.getElementById('currentYear').textContent = new Date().getFullYear();

// PWA Install Button Functionality
let deferredPrompt;
const installButton = document.getElementById('pwaInstallButton');
const installContainer = document.getElementById('pwaInstallContainer');

// Listen for the beforeinstallprompt event
window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the mini-infobar from appearing on mobile
    e.preventDefault();
    // Stash the event so it can be triggered later
    deferredPrompt = e;
    // Show the install button
    installContainer.style.display = 'flex';
});

// Handle install button click
installButton.addEventListener('click', async () => {
    if (!deferredPrompt) {
        // If the prompt isn't available, show instructions
        showInstallInstructions();
        return;
    }
    
    // Show the install prompt
    deferredPrompt.prompt();
    
    // Wait for the user to respond to the prompt
    const { outcome } = await deferredPrompt.userChoice;
    
    if (outcome === 'accepted') {
        console.log('User accepted the install prompt');
        installButton.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Installed!</span>';
        installButton.disabled = true;
    } else {
        console.log('User dismissed the install prompt');
    }
    
    // Clear the deferredPrompt
    deferredPrompt = null;
    installContainer.style.display = 'none';
});

// Hide install button if app is already installed
window.addEventListener('appinstalled', () => {
    console.log('PWA was installed');
    installContainer.style.display = 'none';
    deferredPrompt = null;
});

// Check if app is already installed (standalone mode)
if (window.matchMedia('(display-mode: standalone)').matches || 
    window.navigator.standalone === true) {
    installContainer.style.display = 'none';
}

// Show install instructions for iOS
function showInstallInstructions() {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
    if (isIOS) {
        alert('To install this app on your iOS device:\n\n1. Tap the Share button\n2. Tap "Add to Home Screen"\n3. Tap "Add"');
    } else {
        alert('To install this app:\n\nLook for the install icon in your browser\'s address bar, or use the browser menu to "Install App".');
    }
}

// Peek a sliver of the public footer until the user scrolls to the bottom
(function() {
    if (window.__wrFooterPeekInit) return;
    window.__wrFooterPeekInit = true;

    function mainFooter() {
        const list = document.querySelectorAll('.app-footer');
        list.forEach(function (footer, index) {
            if (index > 0) footer.style.display = 'none';
        });
        return list[0] || null;
    }

    function ensureRevealSpace(footer) {
        let space = document.getElementById('footer-reveal-space');
        const host = document.querySelector('.container') || document.body;
        if (!space) {
            space = document.createElement('div');
            space.id = 'footer-reveal-space';
            space.setAttribute('aria-hidden', 'true');
            host.appendChild(space);
        } else if (space.parentNode !== host) {
            host.appendChild(space);
        }
        const extra = Math.max(120, footer ? footer.offsetHeight : 140);
        space.style.height = extra + 'px';
        space.style.width = '100%';
        space.style.pointerEvents = 'none';
        space.style.flexShrink = '0';
        return space;
    }

    function isAtPageBottom() {
        const loginPage = document.getElementById('corporateLoginPage');
        const loginActive = document.body.classList.contains('corporate-login-active');
        if (loginActive && loginPage) {
            return loginPage.scrollTop + loginPage.clientHeight >= loginPage.scrollHeight - 32;
        }
        const scrollTop = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
        const viewport = window.innerHeight || document.documentElement.clientHeight;
        const full = Math.max(
            document.documentElement.scrollHeight,
            document.body.scrollHeight,
            document.documentElement.offsetHeight
        );
        return scrollTop + viewport >= full - 48;
    }

    function updateFooterVisibility() {
        const footer = mainFooter();
        if (!footer) return;
        const loginActive = document.body.classList.contains('corporate-login-active');
        const space = ensureRevealSpace(footer);
        if (loginActive) {
            space.style.height = '0px';
            footer.classList.remove('is-peeking');
            return;
        }
        if (isAtPageBottom()) {
            footer.classList.remove('is-peeking');
        } else {
            footer.classList.add('is-peeking');
        }
    }

    let ticking = false;
    function requestTick() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(function () {
            updateFooterVisibility();
            ticking = false;
        });
    }

    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', updateFooterVisibility, { passive: true });
    document.addEventListener('touchmove', requestTick, { passive: true });
    const loginPage = document.getElementById('corporateLoginPage');
    if (loginPage) {
        loginPage.addEventListener('scroll', requestTick, { passive: true });
    }

    const space = ensureRevealSpace(mainFooter());
    if (space && 'IntersectionObserver' in window) {
        const io = new IntersectionObserver(function (entries) {
            const footer = mainFooter();
            if (!footer || document.body.classList.contains('corporate-login-active')) return;
            const visible = entries.some(function (entry) { return entry.isIntersecting && entry.intersectionRatio > 0; });
            footer.classList.toggle('is-peeking', !visible);
        }, { root: null, threshold: 0.01, rootMargin: '0px 0px -8px 0px' });
        io.observe(space);
    }

    updateFooterVisibility();
    setTimeout(updateFooterVisibility, 200);
    setTimeout(updateFooterVisibility, 800);
})();
</script>
